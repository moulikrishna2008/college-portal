<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>

    <div class="register-container">

        <div class="register-card">


            <!-- College Logo -->

            <img
                src="college-logo.jpeg"
                class="logo"
                alt="College Logo"
            >


            <!-- Heading -->

            <h1>
                Student Registration
            </h1>


            <p class="subtitle">
                Register using your official college email
            </p>



            <!-- =================================
                 STEP 1 - COLLEGE EMAIL
            ================================== -->

            <div id="emailStep">

                <div class="input-group">

                    <label for="collegeEmail">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="collegeEmail"
                        placeholder="Enter your college email"
                    >

                </div>


                <button
                    type="button"
                    class="main-btn"
                    onclick="sendOTP()">

                    SEND OTP

                </button>

            </div>



            <!-- =================================
                 STEP 2 - OTP
            ================================== -->

            <div
                id="otpStep"
                style="display: none;">

                <div class="input-group">

                    <label for="otp">
                        Enter OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        maxlength="6"
                        placeholder="Enter 6-digit OTP"
                    >

                </div>


                <button
                    type="button"
                    class="main-btn"
                    onclick="verifyOTP()">

                    VERIFY OTP

                </button>

            </div>



            <!-- =================================
                 STEP 3 - STUDENT DETAILS
            ================================== -->

            <div
                id="detailsStep"
                style="display: none;">


                <!-- Registration ID -->

                <div class="input-group">

                    <label for="registrationId">
                        Registration ID
                    </label>

                    <input
                        type="text"
                        id="registrationId"
                        placeholder="Enter your college Registration ID"
                    >

                </div>



                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create your password"
                    >

                </div>



                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >

                </div>



                <!-- Branch -->

                <div class="input-group">

                    <label for="branch">
                        Branch
                    </label>

                    <select id="branch">

                        <option value="">
                            Select Branch
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            MECH
                        </option>

                        <option value="CIVIL">
                            CIVIL
                        </option>

                        <option value="IT">
                            IT
                        </option>

                    </select>

                </div>



                <!-- Year -->

                <div class="input-group">

                    <label for="year">
                        Year
                    </label>

                    <select id="year">

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>



                <!-- Submit -->

                <button
                    type="button"
                    class="main-btn"
                    onclick="submitRegistration()">

                    CONFIRM REGISTRATION

                </button>

            </div>



            <!-- Message -->

            <p id="registerMessage"></p>



            <!-- Back -->

            <button
                type="button"
                class="back-btn"
                onclick="goToLogin()">

                Back to Login

            </button>


        </div>

    </div>


    <!-- JavaScript -->

    <script src="register.js"></script>

</body>

</html>
