<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>College Portal Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">


            <!-- College Logo -->

            <img
                src="../assets/college-logo.jpeg"
                class="login-logo"
                alt="College Logo"
            >


            <!-- Heading -->

            <h1>
                College Portal
            </h1>


            <p class="subtitle">
                Login to your account
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- User ID -->

                <div class="input-group">

                    <label for="userId">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        placeholder="Enter your User ID"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    LOGIN

                </button>


                <!-- Login Message -->

                <p id="loginMessage"></p>


            </form>


            <!-- Student Registration -->

            <div class="register-area">

                <p>
                    New student?
                </p>


                <button
                    type="button"
                    class="register-btn"
                    onclick="openRegister()">

                    Register as Student

                </button>

            </div>


        </div>

    </div>


    <!-- JavaScript -->

    <script src="login.js"></script>

</body>

</html>
